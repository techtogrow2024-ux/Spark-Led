<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARK LED WALLS - Launching Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* LED Dots Grid Background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Gold Glow Background */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.2) 0%, rgba(184, 134, 11, 0.05) 50%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            filter: blur(60px);
            animation: pulse 5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Floating Sparks Canvas */
        #sparksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
        }

        /* Center Content Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
            max-width: 700px;
            width: 100%;
        }

        /* Original Logo Image Box */
        .logo-box {
            position: relative;
            margin-bottom: 2.5rem;
            max-width: 480px;
            width: 90%;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(242, 201, 76, 0.25);
            overflow: hidden;
            border: 1px solid rgba(242, 201, 76, 0.3);
            background: #000000;
        }

        .logo-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
        }

        /* Launching Soon Headline */
        .title {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #fff1b0 40%, #e6ac00 80%, #997300 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(242, 201, 76, 0.4);
            padding-left: 0.3em;
            position: relative;
        }

        .title::after {
            content: '';
            display: block;
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f2c94c, transparent);
            margin: 1.5rem auto 0 auto;
            border-radius: 2px;
            box-shadow: 0 0 10px #f2c94c;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="ambient-glow"></div>
    <canvas id="sparksCanvas"></canvas>

    <div class="container">
        
        <!-- Exact Logo File Image -->
        <div class="logo-box">
            <img src="WhatsApp Image 2026-09-17 at 5.30.01 PM.jpeg" alt="SPARK LED WALLS Logo" class="logo-img">
        </div>

        <h1 class="title">Launching Soon</h1>

    </div>

    <script>
        // Floating Background Sparks Animation
        const canvas = document.getElementById('sparksCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Spark {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 40;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * 1 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.color = Math.random() > 0.4 ? '#f2c94c' : (Math.random() > 0.5 ? '#00e5ff' : '#ff007f');
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        const sparks = Array.from({ length: 40 }, () => new Spark());
        function animate() {
            ctx.clearRect(0, 0, width, height);
            sparks.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
